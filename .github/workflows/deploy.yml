name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install and build
        run: |
          npm run install:all
          npm run build

      - name: Verify production artifact
        run: npm run verify:artifact

      # SWA managed Functions reject oversized API zips (~100–250 MB). Full
      # install:all includes vitest/typescript; prune to runtime deps only
      # before upload. skip_api_build keeps Oryx from reinstalling everything.
      - name: Prune API to production dependencies
        run: npm --prefix api ci --omit=dev

      - name: Deploy to Azure Static Web Apps
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          # With skip_app_build: true, app_location must already be the built
          # output folder and output_location must be empty — the action
          # otherwise zips the raw frontend/ source tree (including the dev
          # index.html that references /src/main.tsx, which browsers can't
          # execute) instead of frontend/dist/.
          app_location: 'frontend/dist'
          api_location: 'api'
          output_location: ''
          skip_app_build: true
          skip_api_build: true

  close_preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close preview environment
    steps:
      - name: Close Azure Static Web Apps preview
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: 'close'
